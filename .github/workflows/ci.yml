name: CI

# What runs when (ADR 0294, ADR 0295):
#
#   pull request      `Lint · Build · Test` (required) and `UI smoke`
#   push to `main`    the whole UI suite as `UI tests 1/3`, `2/3` and `3/3`, one runner each,
#                     and `UI tests`, which passes only if all three did. Nothing else.
#   manual dispatch   `Lint · Build · Test` and the whole UI suite, as on `main`, on any branch
#
# Branch protection makes a PR catch up with `main` before it merges, so the commit a merge
# puts on `main` has the tree the PR's last run already tested. Running the required job on
# it again tested nothing new. The whole UI suite is the one thing a PR did not run, so that
# is what the push runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The simulator both macOS jobs test on, pinned by name and iOS version (ADR 0255).
# `scripts/ci-simulator.sh` fails and lists what the runner has if the image drops it.
env:
  SIM_NAME: iPhone 16 Pro
  SIM_OS: "18.5"

jobs:
  # Decide whether this change can skip the expensive checks. Kept as a separate
  # job so the answer can pick the runner: a docs-only PR never claims a macOS
  # runner, which is where the queue time lives.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
      ui_plans: ${{ steps.plans.outputs.ui_plans }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # docs-only.sh diffs against the base commit
      - id: check
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          RESULT=$(scripts/docs-only.sh "$BASE" "${{ github.sha }}")
          echo "docs_only=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Docs-only: $RESULT"
          git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || true

      # Which UI plans run, one runner each: the `ui` job's matrix. A pull request runs the smoke
      # (ADR 0294); anything else runs the whole suite in three shards (ADR 0295). Decided here
      # because a matrix can read `needs` and `github` but not `env`.
      - id: plans
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            PLANS='[{"plan":"PocketSmoke","name":"UI smoke"}]'
          else
            PLANS='[{"plan":"PocketUIShard1","name":"UI tests 1/3"},{"plan":"PocketUIShard2","name":"UI tests 2/3"},{"plan":"PocketUIShard3","name":"UI tests 3/3"}]'
          fi
          echo "ui_plans=$PLANS" >> "$GITHUB_OUTPUT"
          echo "UI plans: $PLANS"

  lint-build-test:
    # NOTE: this name is the required status check on `main` — branch protection
    # matches it verbatim, so renaming the job blocks every PR until the
    # protection rule is updated to match. The job therefore always runs (and
    # always reports); it is the STEPS that are skipped for a docs-only change.
    # Putting a paths filter on `on:` instead would stop the check reporting at
    # all, and a required check that never reports can never be satisfied.
    name: Lint · Build · Test
    needs: scope
    # Skipped on a push to `main` (ADR 0294): the PR's run already tested this tree. This `if:`
    # is safe where a paths filter is not (ADR 0133), because it never skips the job on a pull
    # request, and a pull request is the only place the check is required.
    if: github.event_name != 'push'
    runs-on: ${{ needs.scope.outputs.docs_only == 'true' && 'ubuntu-latest' || 'macos-15' }}
    # A backstop for a hung run, not a budget. Since ADR 0255 this job runs the unit tests only (the
    # UI tests moved to `ui-tests` below), and on main's last combined run the build and unit tests
    # took about 6 minutes of its 28. Was 60 while it carried the UI tests too.
    timeout-minutes: 30
    steps:
      - name: Docs-only change
        if: needs.scope.outputs.docs_only == 'true'
        run: echo "Documentation-only change — lint, build and test skipped."

      # Unconditional, because the manual check below is unconditional and
      # cannot read a repository that was never checked out. A docs-only run
      # previously took this branch and did nothing at all; on ubuntu the
      # checkout costs a couple of seconds.
      - uses: actions/checkout@v4

      # The manual (ADR 0165 D8). NO `if:` — a docs-only change is precisely the
      # change this guards, and it is the change that turns every other step in
      # this job off. It lives here, inside `lint-build-test`, rather than in a
      # job of its own or in `scope`, because `lint-build-test` is the required
      # status check: `scope` is a `needs:` dependency, so failing it *skips* the
      # required check, and a required check that never reports is a PR that can
      # never merge (ADR 0133's trap, in a new costume).
      - name: Check the manual
        run: scripts/check-manual.py

      # Use the runner's default Xcode — it has iOS simulator runtimes
      # pre-installed. Pinning a specific Xcode_*.app can select a version whose
      # simulator runtime isn't installed (the "iOS NN.0 is not installed" error).
      - name: Show Xcode
        if: needs.scope.outputs.docs_only != 'true'
        run: xcodebuild -version

      - name: Install tools
        if: needs.scope.outputs.docs_only != 'true'
        run: brew install xcodegen swiftlint xcbeautify

      - name: Generate Xcode project
        if: needs.scope.outputs.docs_only != 'true'
        run: xcodegen generate

      - name: SwiftLint
        if: needs.scope.outputs.docs_only != 'true'
        run: swiftlint --strict

      # Booted and settled before the timed run (ADR 0146), on the pinned device (ADR 0255).
      - name: Boot the simulator
        if: needs.scope.outputs.docs_only != 'true'
        run: scripts/ci-simulator.sh "$SIM_NAME" "$SIM_OS"

      # The unit tests, `PocketLogic`. The UI smoke run is beside this job, in `ui-tests`, so the
      # required check reports in minutes rather than waiting on it (ADR 0255).
      - name: Build & test
        if: needs.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail   # without pipefail, '| xcbeautify' masks xcodebuild failures
          # `-retry-tests-on-failure -test-iterations 2` re-runs only what failed, so a
          # genuine break still fails both attempts while a one-off timing loss does not
          # redden `main`. This deliberately trades "every red is real" away, so the raw
          # log is teed out and the next step reports any test that needed a retry —
          # a green run with retries in it is NOT a clean run (ADR 0146).
          #
          # Was 3 in pass 1, when the flake's cause was still unfixed and the budget was
          # covering for it. Pass 2 removed that cause — the tests now wait on a signal the
          # app raises rather than on a guess — so the allowance drops to a single retry:
          # enough for a lost runner or a genuinely unlucky box, not enough for a test to
          # flake twice and still come out green. Removing it entirely is the endpoint;
          # that wants a stretch of retry-free runs behind it first.
          xcodebuild test \
            -scheme Pocket \
            -testPlan PocketLogic \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-raw.log | xcbeautify
          scripts/assert-tests-ran.sh xcodebuild-raw.log
        env:
          NSUnbufferedIO: YES

      # The result bundle, kept. `-resultBundlePath` above has always written one; nothing
      # ever collected it, so a test that passes locally and fails only on this runner (older
      # Xcode, slower box) could not be diagnosed at all — the choice was guessing at ~11
      # minutes a round or deleting the test, and deleting the test is what happened. Runs on
      # failure too, because the failed run is the only one worth downloading.
      - name: Upload test results
        if: always() && needs.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          # The extension is spelled out on `-resultBundlePath` above rather than left to the
          # toolchain (Xcode 26.5 takes the path verbatim, so a bare `TestResults` downloads as
          # a folder Xcode won't open until it's renamed). The raw log rides along — it holds
          # the failure text xcbeautify swallows.
          path: |
            TestResults.xcresult
            xcodebuild-raw.log
          retention-days: 14
          if-no-files-found: warn

      # Runs even when the tests failed, so a red run also names what was retried.
      - name: Report retried tests
        if: always() && needs.scope.outputs.docs_only != 'true'
        shell: bash
        run: scripts/report-test-retries.sh xcodebuild-raw.log

  ui:
    # The UI tests, beside the required job rather than inside it (ADR 0255), one runner per plan
    # in `scope`'s `ui_plans`.
    #
    # On a pull request that is one runner, `UI smoke`, running `PocketSmoke`: the few classes that
    # prove the app launches and its main doors open, under 4 minutes of tests (ADR 0294). On a push
    # to `main`, or a manual dispatch, it is three, `UI tests 1/3` to `3/3`, running the whole suite
    # split by `PocketUIShard1`–`3`: 39 minutes of tests on one runner became about 13 on each (ADR
    # 0295). Each shard builds the app itself. Building once and handing the products on would put
    # an upload and a download in front of every shard's tests, and macOS minutes cost nothing
    # here, so three builds side by side finish sooner. Three shards plus a pull request's two macOS
    # jobs is GitHub Free's limit of five concurrent macOS jobs; a fourth shard would queue.
    #
    # NOT a required check under any name, deliberately: a UI test that flakes on this runner does
    # not hold a PR. What it costs is a rule instead of a gate — **no release build until main's UI
    # job is green**. The job that rule reads is `UI tests`, below, not these.
    #
    # A job-level `if:` is safe here and would not be on the required job (ADR 0133): a skipped
    # job reports as skipped, and nothing waits on this one. A docs-only change skips it.
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: macos-15
    strategy:
      # Every shard runs to the end when one fails: a red shard should not hide what the other
      # two would have said.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.ui_plans) }}
    env:
      UI_PLAN: ${{ matrix.plan }}
    # A backstop for a hung run, not a budget. A shard is about 13 minutes of tests and 12 of boot
    # and build; the smoke's first run took 38 minutes on a slow runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Boot the simulator
        run: scripts/ci-simulator.sh "$SIM_NAME" "$SIM_OS"

      # Same retry allowance and the same reasons as the unit tests above (ADR 0146): one
      # retry, and every retry named by the report step.
      - name: Build & UI test
        shell: bash
        run: |
          set -euo pipefail   # without pipefail, '| xcbeautify' masks xcodebuild failures
          xcodebuild test \
            -scheme Pocket \
            -testPlan "$UI_PLAN" \
            -destination "id=$SIM_UDID" \
            -resultBundlePath UITestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-raw.log | xcbeautify
          scripts/assert-tests-ran.sh xcodebuild-raw.log
        env:
          NSUnbufferedIO: YES

      # Named apart from the unit job's `TestResults` and from each other: two artifacts in one run
      # can't share a name.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UITestResults-${{ matrix.plan }}
          path: |
            UITestResults.xcresult
            xcodebuild-raw.log
          retention-days: 14
          if-no-files-found: warn

      - name: Report retried tests
        if: always()
        shell: bash
        run: scripts/report-test-retries.sh xcodebuild-raw.log

  ui-tests:
    # One answer for the whole suite (ADR 0295): green only when all three shards are. This is the
    # check `scripts/main-ui-green.sh` reads, by this exact name, so the release rule — **no release
    # build until main's UI job is green** — still has one job to ask. Renaming it breaks that
    # script without failing anything; change both or neither.
    #
    # `always()` because the answer must exist whenever the shards were meant to run. Without it a
    # failed or cancelled shard would *skip* this job, and the script reads `skipped` as a docs-only
    # commit and walks back past it to an older green. With it, the job runs and reports red. It is
    # still skipped on a pull request, which runs the smoke instead, and on a docs-only change,
    # which is the one `skipped` the script is right to step over.
    name: UI tests
    needs: [scope, ui]
    if: always() && github.event_name != 'pull_request' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.ui.result }}
        run: |
          echo "The UI shards: $SHARDS"
          if [ "$SHARDS" != success ]; then
            echo "::error title=UI tests not green::A UI shard reported '$SHARDS'. No release build until all three pass (ADR 0255, ADR 0295)."
            exit 1
          fi
