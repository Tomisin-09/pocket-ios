name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether this change can skip the expensive checks. Kept as a separate
  # job so the answer can pick the runner: a docs-only PR never claims a macOS
  # runner, which is where the queue time lives.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # docs-only.sh diffs against the base commit
      - id: check
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          RESULT=$(scripts/docs-only.sh "$BASE" "${{ github.sha }}")
          echo "docs_only=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Docs-only: $RESULT"
          git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || true

  lint-build-test:
    # NOTE: this name is the required status check on `main` — branch protection
    # matches it verbatim, so renaming the job blocks every PR until the
    # protection rule is updated to match. The job therefore always runs (and
    # always reports); it is the STEPS that are skipped for a docs-only change.
    # Putting a paths filter on `on:` instead would stop the check reporting at
    # all, and a required check that never reports can never be satisfied.
    name: Lint · Build · Test
    needs: scope
    runs-on: ${{ needs.scope.outputs.docs_only == 'true' && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - name: Docs-only change
        if: needs.scope.outputs.docs_only == 'true'
        run: echo "Documentation-only change — lint, build and test skipped."

      # Unconditional, because the manual check below is unconditional and
      # cannot read a repository that was never checked out. A docs-only run
      # previously took this branch and did nothing at all; on ubuntu the
      # checkout costs a couple of seconds.
      - uses: actions/checkout@v4

      # The manual (ADR 0165 D8). NO `if:` — a docs-only change is precisely the
      # change this guards, and it is the change that turns every other step in
      # this job off. It lives here, inside `lint-build-test`, rather than in a
      # job of its own or in `scope`, because `lint-build-test` is the required
      # status check: `scope` is a `needs:` dependency, so failing it *skips* the
      # required check, and a required check that never reports is a PR that can
      # never merge (ADR 0133's trap, in a new costume).
      - name: Check the manual
        run: scripts/check-manual.py

      # Use the runner's default Xcode — it has iOS simulator runtimes
      # pre-installed. Pinning a specific Xcode_*.app can select a version whose
      # simulator runtime isn't installed (the "iOS NN.0 is not installed" error).
      - name: Show Xcode
        if: needs.scope.outputs.docs_only != 'true'
        run: xcodebuild -version

      - name: Install tools
        if: needs.scope.outputs.docs_only != 'true'
        run: brew install xcodegen swiftlint xcbeautify

      - name: Generate Xcode project
        if: needs.scope.outputs.docs_only != 'true'
        run: xcodegen generate

      - name: SwiftLint
        if: needs.scope.outputs.docs_only != 'true'
        run: swiftlint --strict

      - name: Build & test
        if: needs.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail   # without pipefail, '| xcbeautify' masks xcodebuild failures
          # Pick an installed iPhone simulator dynamically rather than pinning an
          # OS version that may not be present on the runner image.
          UDID=$(xcrun simctl list devices available \
            | grep -E 'iPhone' \
            | grep -oE '[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}' \
            | head -n 1)
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found:"; xcrun simctl list devices; exit 1
          fi
          echo "Using simulator UDID: $UDID"
          # Boot and settle the simulator BEFORE the timed run (ADR 0146). Handing a cold
          # UDID straight to `xcodebuild test` puts boot + SpringBoard settling inside the
          # window the UI tests' own waits are budgeted against, which is a large part of
          # why those waits had to be guesses. `bootstatus -b` blocks until the device
          # reports fully booted; `boot` is tolerated failing because an already-booted
          # device exits non-zero.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # `-retry-tests-on-failure -test-iterations 2` re-runs only what failed, so a
          # genuine break still fails both attempts while a one-off timing loss does not
          # redden `main`. This deliberately trades "every red is real" away, so the raw
          # log is teed out and the next step reports any test that needed a retry —
          # a green run with retries in it is NOT a clean run (ADR 0146).
          #
          # Was 3 in pass 1, when the flake's cause was still unfixed and the budget was
          # covering for it. Pass 2 removed that cause — the tests now wait on a signal the
          # app raises rather than on a guess — so the allowance drops to a single retry:
          # enough for a lost runner or a genuinely unlucky box, not enough for a test to
          # flake twice and still come out green. Removing it entirely is the endpoint;
          # that wants a stretch of retry-free runs behind it first.
          # `-parallel-testing-enabled` distributes test **classes** (not methods) across cloned
          # simulators. There are seven UI classes and the two long poles — RoutineLibraryUITests
          # (~89s) and ExerciseInstrumentUITests (~92s) — are the ones worth landing on different
          # workers.
          #
          # **The tension with ADR 0146, stated rather than discovered later:** that ADR pre-boots the
          # destination so boot and SpringBoard settling sit outside the timed window. A clone does
          # not inherit that — each worker boots its own, which is new cost this flag adds back. Two
          # workers is the balance: enough to halve the 282s of UI tests, few enough that the added
          # boots and the CPU contention do not eat the saving. Contention is also how a parallel
          # suite turns a time saving into a flake, which 0146 spent two passes buying back.
          #
          # Not individually measured — runner variance on macos-15 is wider than the effect (ADR
          # 0191). A green run cannot prove a small win, but it can rule out a large regression,
          # which is the one-sided test this is kept on.
          xcodebuild test \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers 2 \
            -scheme Pocket \
            -testPlan PocketAll \
            -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-raw.log | xcbeautify
        env:
          NSUnbufferedIO: YES

      # The result bundle, kept. `-resultBundlePath` above has always written one; nothing
      # ever collected it, so a test that passes locally and fails only on this runner (older
      # Xcode, slower box) could not be diagnosed at all — the choice was guessing at ~11
      # minutes a round or deleting the test, and deleting the test is what happened. Runs on
      # failure too, because the failed run is the only one worth downloading.
      - name: Upload test results
        if: always() && needs.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          # The extension is spelled out on `-resultBundlePath` above rather than left to the
          # toolchain (Xcode 26.5 takes the path verbatim, so a bare `TestResults` downloads as
          # a folder Xcode won't open until it's renamed). The raw log rides along — it holds
          # the failure text xcbeautify swallows.
          path: |
            TestResults.xcresult
            xcodebuild-raw.log
          retention-days: 14
          if-no-files-found: warn

      # Runs even when the tests failed, so a red run also names what was retried.
      - name: Report retried tests
        if: always() && needs.scope.outputs.docs_only != 'true'
        shell: bash
        run: scripts/report-test-retries.sh xcodebuild-raw.log