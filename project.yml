# XcodeGen spec. The .xcodeproj is generated from this file, not hand-edited —
# this keeps the project diffable and avoids .pbxproj merge conflicts.
# Regenerate with: xcodegen generate
name: Pocket
options:
  bundleIdPrefix: click.decooperations.pocket
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Must match the App Store Connect version string EXACTLY — ASC compares them as
    # strings, so a "1.1.0" build will not appear in the build picker for a version
    # named "1.1". 1.0 is released ("Ready for Distribution") and therefore locked.
    #
    # 1.4 is the release, started 2026-10-26 (the plan, ADRs 0256 and 0277). 1.1 (3) was the
    # last version approved. 1.2 and 1.3 lived on TestFlight (builds 4-7), and 1.3 (7), cut
    # 2026-09-10 for review, was never submitted. The open version record in ASC, created as
    # "1.2", is renamed to 1.4 rather than replaced, so the store's history reads 1.1, then 1.4.
    MARKETING_VERSION: "1.4"
    # Monotonic, and must exceed every build already uploaded under this bundle id —
    # ASC rejects a duplicate build number outright. Bump this every archive, not just
    # every version. If an upload is refused as a duplicate, raise it again; there is
    # no cost to skipping numbers.
    #
    # `fastlane beta` overwrites this at archive time with
    # `latest_testflight_build_number + 1`, so the committed value is not what ships.
    # It is bumped anyway because the CHANGELOG cuts its sections at the commit that
    # moves this number — it is the only durable record of where a build was taken.
    #
    # **7, not 6.** Build 6 was uploaded to TestFlight from
    # `pocket-273-beta-grant-unconditional`, a branch since deleted, and never reached
    # `main` — so no commit here records it, but ASC does, and ASC is what rejects a
    # duplicate. The number skips because the upload happened, not because the code did.
    #
    # **8** is 1.4's first build (2026-10-26).
    CURRENT_PROJECT_VERSION: "8"
    DEVELOPMENT_TEAM: "" # set via CI / local xcconfig; do not hard-code

# Per-configuration backend base URL (Debug → dev, Release → prod).
configs:
  Debug: debug
  Release: release

# No `packages:` block, and no third-party dependency. The one there was — the Aptabase
# analytics SDK (ADR 0120) — was removed with analytics itself (ADR 0239); usage is read
# from App Store Connect instead, which needs no code. A package added here is a decision,
# not a convenience: ArchiveWriter and ZipArchiveReader each declined one rather than end
# that.

targets:
  Pocket:
    type: application
    platform: iOS
    sources:
      - path: Pocket
        # The share extension's own sources and plists (ADR 0264 D10). They live under `Pocket/` so
        # the "Red Moon, never Pocket" lint rule and check-manual's C9 read them with no widening,
        # and they are excluded here because they belong to `PocketShare`, below.
        excludes:
          - "ShareExtension/**"
    # No `info:` block on purpose: the Info.plist is hand-maintained (it carries
    # documented usage strings, background modes and the portrait lock). An
    # `info:` block makes XcodeGen *generate* — i.e. overwrite — that file on
    # every `xcodegen generate`, silently dropping those keys. The build picks
    # it up via INFOPLIST_FILE below instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: click.decooperations.pocket
        INFOPLIST_FILE: Pocket/Resources/Info.plist
        # iPhone-only (1). Red Moon is a portrait, phone-first app — never QA'd
        # for iPad. Being universal (the Xcode default) triggers App Store
        # validation 90474 (iPad multitasking needs all 4 orientations incl.
        # PortraitUpsideDown) and would require iPad screenshots. iPhone-only
        # sidesteps both; the app still runs on iPad in compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        # App icon lives in Pocket/Resources/Assets.xcassets (AppIcon set).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Warnings are errors for *our* code (AGENTS.md step 2 asks for a warning-free
          # build anyway). This lives here rather than on the pre-push hook's xcodebuild
          # command line because a command-line setting applies to every target in the
          # graph — including SPM dependencies, which Xcode compiles with
          # `-suppress-warnings`, and the two flags conflict outright ("error: conflicting
          # options '-warnings-as-errors' and '-suppress-warnings'"). That broke the first
          # push after Aptabase landed. Debug-only on purpose: an archive should never fail
          # because a future SDK deprecates something.
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # The backend base URL lives in these, not in `settings` above (ADR 0187 S0). It has to:
    # Xcode reads `//` in a build setting as a comment, so `https://host` written inline here
    # becomes `https:`. The `$()` escape that fixes it is only available in an `.xcconfig`.
    # Debug points at a proxy you run locally; Release is deliberately empty until S4, which is
    # what makes a shipped build structurally incapable of an Oracle network call. Each file
    # explains its own value.
    configFiles:
      Debug: Configuration/Pocket-Debug.xcconfig
      Release: Configuration/Pocket-Release.xcconfig
    # The entitlements are declared HERE, not in the file: XcodeGen writes the file from
    # `properties` on every `xcodegen generate`, and a key written only in the file is wiped (and
    # with it any comment). The file used to carry this note as a comment; it can't any more.
    #
    # - One App Group (ADR 0264 D9): *Save to Red Moon* can't open the store, so the app writes the
    #   owner snapshot to it and drains the extension's inbox from it. The store stays in
    #   Application Support. `PocketShare` names the same group; `ShareContainer` names it in code.
    # - No CloudKit or iCloud container: added if and when sync lands.
    # - No Sign in with Apple. That was the plan in ADR 0002 / ADR 0092 §A3 and ADR 0187 D3
    #   superseded it: the Oracle authenticates with App Attest (no entitlement for the default
    #   environment) and meters quota against an opaque token minted at purchase, so it brings no
    #   account. That keeps ADR 0113 intact, and Apple's in-app account-deletion rule never attaches.
    #
    # Do not add an entitlement before the feature that needs it.
    entitlements:
      path: Pocket/Resources/Pocket.entitlements
      properties:
        com.apple.security.application-groups:
          - group.click.decooperations.pocket
    # Embedded, which is also the only way it is built: the scheme builds the app's dependency
    # graph and nothing else (ADR 0264 D10.3), so CI and the pre-push hook compile it through this.
    dependencies:
      - target: PocketShare

  # *Save to Red Moon*, the share extension (ADR 0264 D8–D10). It never opens the store: it reads the
  # owner snapshot the app writes to the App Group and writes saves to an inbox there, which the app
  # files when it next comes to the foreground (D9).
  #
  # Its sources are its own folder plus the shared files listed by name, the way `UITestHooks.swift`
  # is shared with the UI tests: pure rules and value-only views, nothing that touches SwiftData.
  # Adding a file here means the app's copy and this one are the same code, which is the point.
  PocketShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Pocket/ShareExtension
      # The snapshot, the inbox and what a share is (D9, D12).
      - path: Pocket/Core/Sharing/ShareContainer.swift
      - path: Pocket/Core/Sharing/ShareOwnerSnapshot.swift
      - path: Pocket/Core/Sharing/ShareInbox.swift
      - path: Pocket/Core/Sharing/SharedContent.swift
      # D6's rules and the picker's, over values (slice 3).
      - path: Pocket/Core/Plan/ReferenceAttachRules.swift
      - path: Pocket/Core/Plan/PlanAccess.swift
      - path: Pocket/Core/Models/ReferenceDestination.swift
      - path: Pocket/Core/Models/ReferencePlaceKind.swift
      # 0167's rules: http/https only, what a file may be, and how big.
      - path: Pocket/Core/Models/ReferenceURL.swift
      - path: Pocket/Core/Models/ReferenceLinkKind.swift
      - path: Pocket/Core/Models/ReferenceAttachmentCopy.swift
      - path: Pocket/Core/Storage/ReferenceAttachmentStore.swift
      # The place list, and the look: tokens, Futura, and the colours, whose catalog is its own so both
      # targets include it (D10.4).
      - path: Pocket/UI/ReferencePlaceList.swift
      - path: Pocket/UI/DesignTokens.swift
      - path: Pocket/App/AppearancePreference.swift
      - path: Pocket/Resources/Colors.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: click.decooperations.pocket.share
        INFOPLIST_FILE: Pocket/ShareExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        # A second target doesn't inherit the app's (D10.3), so it says the same thing itself.
        Debug:
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # Declared here, as the app's are: XcodeGen writes the file from `properties`. The one place
    # the extension and the app meet (D9): the snapshot and the inbox, never the store.
    entitlements:
      path: Pocket/ShareExtension/PocketShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.click.decooperations.pocket

  PocketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketTests
    # Test bundles have no hand-maintained Info.plist; let Xcode generate one.
    # Xcode 26.5 no longer defaults this on, so without it the bundle can't
    # code-sign and the suite fails to build.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Pocket

  PocketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PocketUITests
      # Compiled into the UI-test bundle as well as the app (ADR 0146 pass 2). A UI test runs in a
      # separate process and cannot `@testable import` the app, so the launch argument and the
      # readiness identifier would otherwise be the same string literal written out in two targets —
      # and a rename that breaks the match doesn't fail fast, it waits out the full timeout and then
      # blames the wrong assertion. Strings only; the file deliberately holds no app types.
      - path: Pocket/Core/Testing/UITestHooks.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Pocket

  # The user manual's screenshot run (ADR 0165 Phase 5) — its own target, not a corner of
  # `PocketUITests`, and the difference is not tidiness.
  #
  # These classes are not tests. They photograph a device `scripts/shoot-manual.sh` has erased,
  # seeded, forced dark and given a faked status bar. Run anywhere else they do not error out —
  # they walk a first-run app and fail on the *state*, which is how ten of them ended up in a CI
  # run reporting sixteen assertions about rows that were not there.
  #
  # They lived in `PocketUITests` with `PocketAll` skipping them by name, and that is a **policy**:
  # two lists that both have to grow, and Phase 5 grew only one. A separate target is a
  # **boundary** — `PocketAll` contains `PocketUITests` and therefore cannot run these, with
  # nothing to remember and no list to keep in step. It also makes the day this work is finished a
  # one-directory deletion.
  PocketShootUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PocketShootUITests
      # Both shared files are compiled in rather than depended on: a UI-test bundle cannot import
      # another, and `UITestHooks` is already duplicated into the app for the same reason (above).
      - path: PocketUITests/UITestCase.swift
      - path: Pocket/Core/Testing/UITestHooks.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Pocket

schemes:
  Pocket:
    build:
      targets:
        Pocket: all
    run:
      # The plan's two products (ADR 0256 D9) for the simulator and for device runs Xcode launches.
      # While this is set StoreKit serves the file and never asks the sandbox, so purchases "work"
      # without proving anything about App Store Connect. `scripts/run-device.sh` launches through
      # `devicectl`, which never applies it: its builds have the plan unlocked (`PLAN_UNLOCKED`),
      # and with `-s` they read the real sandbox.
      storeKitConfiguration: Configuration/RedMoon.storekit
    test:
      # Four test plans (see docs/decisions/0053). The default is the fast
      # logic-only plan (unit tests, no coverage) run on local pre-push.
      # `PocketAll` is both suites, for running everything locally.
      #
      # CI runs the other two side by side (ADR 0255): `PocketLogic` in the required
      # job, and `PocketUI`, the UI tests alone, in a second job of its own. They are
      # plans rather than `-only-testing:` flags on `PocketAll` for the reason below.
      #
      # `PocketShoot` is the manual's screenshot run (ADR 0165 Phase 5) and exists
      # because those four classes are not tests. They photograph an erased device
      # that `scripts/shoot-manual.sh` has staged with seed audio and a faked status
      # bar, so on CI's ordinary simulator they are seven minutes of flake producing
      # attachments nobody collects. `PocketAll` skips them; this plan selects them.
      #
      # It is a plan rather than `-skip-testing:` flags because a flag list would have
      # to be repeated in `ci.yml` and `pre-push.sh` and would drift. It is not done
      # with `skippedTests` alone, either: `-only-testing:` does **not** override a
      # plan's skip list — it runs zero tests and exits 0, which is a silent green and
      # exactly the failure this harness is written against.
      testPlans:
        - path: PocketLogic.xctestplan
          defaultPlan: true
        - path: PocketAll.xctestplan
        - path: PocketUI.xctestplan
        - path: PocketShoot.xctestplan