# XcodeGen spec. The .xcodeproj is generated from this file, not hand-edited —
# this keeps the project diffable and avoids .pbxproj merge conflicts.
# Regenerate with: xcodegen generate
name: Pocket
options:
  bundleIdPrefix: click.decooperations.pocket
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "" # set via CI / local xcconfig; do not hard-code

# Per-configuration backend base URL (Debug → dev, Release → prod).
configs:
  Debug: debug
  Release: release

# The project's only third-party dependency (ADR 0120). Aptabase is MIT-licensed,
# privacy-first product analytics: no device identifier, no cookie, no fingerprint,
# and it tracks nothing automatically — every event is one we send deliberately from
# the closed `AnalyticsEvent` vocabulary. Pinned to an exact version rather than a
# range: this is the one component that can send data off-device, so an upgrade
# should be a deliberate, reviewed act, not something a resolve picks up.
packages:
  Aptabase:
    url: https://github.com/aptabase/aptabase-swift
    exactVersion: 0.3.11

targets:
  Pocket:
    type: application
    platform: iOS
    sources:
      - path: Pocket
    dependencies:
      - package: Aptabase
        product: Aptabase
    # No `info:` block on purpose: the Info.plist is hand-maintained (it carries
    # documented usage strings, background modes and the portrait lock). An
    # `info:` block makes XcodeGen *generate* — i.e. overwrite — that file on
    # every `xcodegen generate`, silently dropping those keys. The build picks
    # it up via INFOPLIST_FILE below instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: click.decooperations.pocket
        INFOPLIST_FILE: Pocket/Resources/Info.plist
        # iPhone-only (1). Red Moon is a portrait, phone-first app — never QA'd
        # for iPad. Being universal (the Xcode default) triggers App Store
        # validation 90474 (iPad multitasking needs all 4 orientations incl.
        # PortraitUpsideDown) and would require iPad screenshots. iPhone-only
        # sidesteps both; the app still runs on iPad in compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        # App icon lives in Pocket/Resources/Assets.xcassets (AppIcon set).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ADR 0120. Aptabase's App Key is a **write-only ingest key**, not a secret: it can
        # only post events and grants no read access to the dashboard, so it must ship in the
        # client by design. That is the one carve-out to AGENTS.md's "no API keys in the client,
        # ever" — which stands unchanged for the Claude proxy key (ADR 0002), a real credential
        # that never leaves the backend. Empty here until an Aptabase app exists; the sink stays
        # inert on an empty key, so the app ships collecting nothing either way. One key, not one
        # per config: the SDK's TrackingMode.readFromEnvironment stamps `isDebug` from #if DEBUG
        # and the dashboard separates debug traffic on its own. The `A-EU-` prefix is
        # load-bearing — the SDK derives the ingest host from it, so a US key would silently
        # send EU users' events to the wrong region. AptabaseSinkTests pins that.
        APTABASE_APP_KEY: "A-EU-2959015188"
      # Backend base URL is injected per-config in Phase 4 (when the proxy
      # exists). Note: '//' in an Xcode build setting is treated as a comment,
      # so the URL is supplied via an .xcconfig using the `$()//` escape, not
      # inline here. Placeholders below are host-only to avoid that footgun.
      configs:
        Debug:
          POCKET_API_HOST: "localhost:8787"
          # Warnings are errors for *our* code (AGENTS.md step 2 asks for a warning-free
          # build anyway). This lives here rather than on the pre-push hook's xcodebuild
          # command line because a command-line setting applies to every target in the
          # graph — including SPM dependencies, which Xcode compiles with
          # `-suppress-warnings`, and the two flags conflict outright ("error: conflicting
          # options '-warnings-as-errors' and '-suppress-warnings'"). That broke the first
          # push after Aptabase landed. Debug-only on purpose: an archive should never fail
          # because a future SDK deprecates something.
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        Release:
          POCKET_API_HOST: "api.pocket.example.com"
    entitlements:
      path: Pocket/Resources/Pocket.entitlements

  PocketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketTests
    # Test bundles have no hand-maintained Info.plist; let Xcode generate one.
    # Xcode 26.5 no longer defaults this on, so without it the bundle can't
    # code-sign and the suite fails to build.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Pocket

  PocketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PocketUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Pocket

schemes:
  Pocket:
    build:
      targets:
        Pocket: all
    run:
      # Local StoreKit testing for Red Moon Pro (ADR 0112) — the scheme serves the two
      # subscription products + 14-day intro offer from this config so the paywall and
      # entitlement flow can be exercised with no App Store Connect / sandbox dependency.
      storeKitConfiguration: Configuration/RedMoonPro.storekit
    test:
      # Two test plans (see docs/decisions/0053). The default is the fast
      # logic-only plan (unit tests, no coverage) run on local pre-push; CI
      # selects the full plan (adds UI tests + coverage) with `-testPlan PocketAll`.
      testPlans:
        - path: PocketLogic.xctestplan
          defaultPlan: true
        - path: PocketAll.xctestplan